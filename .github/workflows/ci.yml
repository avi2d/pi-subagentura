name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [baseline-0.80.6, latest-0.80.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Install latest compatible Pi SDK
        if: matrix.pi == 'latest-0.80.x'
        run: >-
          npm install --no-save --package-lock=false
          '@earendil-works/pi-agent-core@>=0.80.6 <0.81.0'
          '@earendil-works/pi-ai@>=0.80.6 <0.81.0'
          '@earendil-works/pi-coding-agent@>=0.80.6 <0.81.0'
          '@earendil-works/pi-tui@>=0.80.6 <0.81.0'

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Run Pi session integration tests
        run: npm run test:pi
      - name: Check formatting
        run: npm run format:check

      - name: Run tmux integration tests
        run: npm run test:tmux
        env:
          PI_SUBAGENTURA_TMUX_SOCKET: pi-subagentura-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TERM: xterm-256color
      - name: "Verify published tarball is loadable (regression: v2.0.0 missing helpers.ts)"
        run: npx vitest run published-tarball.test.ts

      - name: Verify package can be packed
        run: npm run pack:check
