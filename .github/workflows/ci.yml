name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Pi ${{ matrix.pi-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.80.6", "latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

      - name: Install selected Pi SDK
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: >-
          npm install --no-save --package-lock=false
          "@earendil-works/pi-agent-core@${PI_VERSION}"
          "@earendil-works/pi-ai@${PI_VERSION}"
          "@earendil-works/pi-coding-agent@${PI_VERSION}"
          "@earendil-works/pi-tui@${PI_VERSION}"

      - name: Verify extension loads in selected Pi
        run: |
          npx --no-install pi --version
          PI_OFFLINE=1 npx --no-install pi --offline --no-session \
            -e ./src/subagent.ts --help

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Run Pi session integration tests
        run: npm run test:pi

      - name: Run tmux integration tests
        run: npm run test:tmux
        env:
          PI_SUBAGENTURA_TMUX_SOCKET: pi-subagentura-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TERM: xterm-256color

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage thresholds
        run: npm run coverage:check

      - name: "Verify published tarball is loadable (regression: v2.0.0 missing helpers.ts)"
        run: npx vitest run published-tarball.test.ts

      - name: Verify package can be packed
        run: npm run pack:check
